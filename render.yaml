services:
  # ----------------------------------------------------
  # SYSTEM 1: Node.js Express Token & Signaling Backend
  # ----------------------------------------------------
  - type: web
    name: nirbhaya-connect-server
    env: node
    rootDir: connect/server
    buildCommand: npm install
    startCommand: npm start
    plan: starter
    envVars:
      - key: PORT
        value: 3001
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SYSTEM1_CALLBACK_SECRET
        sync: false

  # ----------------------------------------------------
  # SYSTEM 2: Python FastAPI + WebSocket + AI Engine
  # ----------------------------------------------------
  - type: web
    name: nirbhaya-ai-engine
    env: docker
    dockerfilePath: Engine/Dockerfile
    dockerContext: Engine
    plan: standard
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "https://nirbhaya-sanchar-connect-gik8.vercel.app,https://nirbhaya-sanchar-connect-vv3g.vercel.app,https://nirbhaya-sanchar-connect.onrender.com,http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:3001"
      - key: SYSTEM1_BASE_URL
        value: "https://nirbhaya-connect-server.onrender.com"
      - key: SYSTEM1_CALLBACK_URL
        value: "https://nirbhaya-connect-server.onrender.com/api/nirbhaya/callback"
      - key: SYSTEM1_CALLBACK_SECRET
        value: "nirbhaya_system1_api_key_2026"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
